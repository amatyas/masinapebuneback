# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================
server:
  port: 7777 
spring:
    application:
        name: MasinaPeBuneAPI
    batch:
        job:
            enabled: true 
    profiles:
        # The commented value for `active` can be replaced with valid Spring profiles to load.
        # Otherwise, it will be filled in by gradle when building the WAR file
        # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
        active: dev
info:
    project:
        version: 1.0 #project.version#

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: '*'

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:mon_token_secret}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  api-url: https://graph.facebook.com/v26.0
  ack-message: "merci bcp bien recu"

webservice:
  multipart-url: ${WEBSERVICE_MULTIPART_URL:}

llm:
  provider: ${LLM_PROVIDER:openai}
  ad-extractor-provider: ${AD_EXTRACTOR_PROVIDER:openai}
  ad-extractor-model: ${AD_EXTRACTOR_MODEL:gpt-6.2-astra}
  mechanical-model: ${LLM2_MODEL:gpt-6.2-sol}
  market-model: ${LLM3_MODEL:gpt-6.1-terra}
  audit-model: ${LLM4_MODEL:gpt-6.1-terra}
  verdict-model: ${LLM5_MODEL:gpt-6.2-sol}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.2-sol}
    url: ${OPENAI_URL:https://api.openai.com/v1/responses}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
