name: PROD -> build and deploy API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 20.0.2
        uses: actions/setup-java@v2
        with:
          java-version: '20.0.2'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean install

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          source: "target/*.jar"
          strip_components: 1
          target: ~/masinapebuneback

      - name: Copy application-prod.yml
        uses: appleboy/scp-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          source: "distrib/application-prod.yml"
          strip_components: 1
          target: ~/masinapebuneback
          
      - name: Copy startBatch.sh to VPS
        uses: appleboy/scp-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          source: "distrib/startBatchProd.sh"
          strip_components: 1
          target: ~/masinapebuneback

      - name: Change file permissions
        uses: appleboy/ssh-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          script: chmod +x ~/masinapebuneback/startBatchProd.sh

      - name: Copy logback-prod.xml to VPS
        uses: appleboy/scp-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          source: "distrib/logback-prod.xml"
          strip_components: 1
          target: ~/masinapebuneback

      - name: Restart service
        uses: appleboy/ssh-action@master
        with:
          host: 51.83.185.55
          username: masinapebune
          password: 7x3W&pL9Gsyvmru%
          script: sudo systemctl restart masinapebuneback.service
